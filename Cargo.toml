[workspace]
resolver = "2"
members = [
    "crates/vara",
    "crates/vara-core",
    "crates/vara-media",
    "crates/vara-chrono",
    "crates/vara-files",
    "crates/vara-net",
    "crates/vara-ui",
    "crates/vara-colour",
    "crates/vara-util"
]

[profile.test]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"