[package]
name = "vara_core"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[dependencies]
dotenvy = "0.15.7"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "pnm",
    "jpeg",
    "bmp",
    "qoi",
    "webp",
] }
memory-stats = "1.2.0"
mlua = { version = "0.12.1", features = [
    "async",
    "luau-jit",
    "serde",
    "macros",
] }
serde = "1.0.229"
serde-saphyr = "1.2.0"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
spin_on = "0.1.1"
symphonia = "0.6.1"
toml = { version = "1.1.6", features = ["preserve_order"] }

vara_util = { path = "../vara-util" }
whoami = "2.1.3"
