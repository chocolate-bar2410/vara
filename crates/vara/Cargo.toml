[package]
name = "vara"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vara"
path = "main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
mlua = { version = "0.12.1", features = ["async", "luau-jit", "vendored"] }

directories = "6.0.0"
async-fs = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }

vara_core = { path = "../vara-core" }
vara_util = { path = "../vara-util" }
vara_media = { path = "../vara-media" }
serde_json = "1.0.151"
async-io = "2.6.0"
jsonc-parser = { version = "0.34.0", features = ["serde"] }
