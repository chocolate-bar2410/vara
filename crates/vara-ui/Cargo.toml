[package]
name = "vara_ui"
edition = "2024"

[lib]
path = "lib.rs"

[dependencies]
mlua = { version = "0.12.1", features = [
    "async",
    "luau-jit",
    "macros"
]}

vara_util = { path = "../vara-util" }
mlua-luau-scheduler = "0.3.0"
smol = "2.0.2"

[target.'cfg(windows)'.dependencies]
windows = {version = "0.62.2",features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
]}
