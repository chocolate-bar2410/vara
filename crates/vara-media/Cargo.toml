[package]
name = "vara_media"
edition = "2024"

[lib]
path = "lib.rs"

[dependencies]
dotenvy = "0.15.7"
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "pnm",
    "jpeg",
    "bmp",
    "qoi",
    "webp",
    "tiff",
] }
mlua = { version = "0.12.1", features = [
    "async",
    "luau-jit",
    "serde",
    "macros",
] }
rusty_flac = "0.1.3"
symphonia = "0.6.1"

vara_files = { path = "../vara-files" }
vara_util = { path = "../vara-util" }
vara_colour = { path = "../vara-colour" }

whoami = "2.1.3"

serde = { version = "1.0.229", features = ["derive"] }
