name: CI pipeline
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install cargo tools
      run: cargo install cargo-audit cargo-deny

    - name: Security check
      run: cargo audit